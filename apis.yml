aid: vesttoo
name: Vesttoo
description: Vesttoo Ltd. was an Israeli insurtech, founded in Tel Aviv in 2018, that operated a technology
  platform for insurance-linked securities and alternative risk transfer — matching insurers, reinsurers
  and MGAs seeking capacity with institutional investors in the capital markets, with an emphasis on non-catastrophe
  life and property/casualty risk. The company collapsed in 2023 after billions of dollars of counterfeit
  letters of credit were discovered being used as collateral on its platform. Vesttoo filed for Chapter
  11 in Delaware in August 2023; a creditors' plan of liquidation was confirmed in early 2024 and went
  effective in April 2024, and the estate is now administered by the Vesttoo Creditors Liquidating Trust,
  which continues to pursue recovery litigation. The company no longer operates. Its domain publishes
  no web host, and no developer portal, API documentation, SDK or machine-readable contract survives at
  any reachable address.
